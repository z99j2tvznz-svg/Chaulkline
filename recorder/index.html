<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chalkline Test Recorder</title>
<style>
:root { --bg: #0d1117; --panel: rgba(16, 20, 27, 0.92); --text: #e8edf3; --muted: #9aa6b2; --accent: #3fb68b; --warn: #e5a83b; --bad: #e5534b; --line: #2b3440; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { overflow: hidden; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; display: flex; gap: 12px; align-items: center; background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,0)); font-size: 14px; z-index: 3; }
#top .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#meter { width: 120px; height: 8px; border-radius: 4px; background: #333; overflow: hidden; }
#meter i { display: block; height: 100%; width: 0; background: var(--accent); }
#panel { position: fixed; z-index: 2; background: var(--panel); border-top: 1px solid var(--line); padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px); left: 0; right: 0; bottom: 0; max-height: 62%; overflow-y: auto; }
@media (orientation: landscape) { #panel { left: auto; top: 0; width: min(46%, 440px); max-height: none; border-top: 0; border-left: 1px solid var(--line); padding-top: calc(env(safe-area-inset-top) + 40px); } }
h2 { font-size: 18px; margin: 0 0 6px; }
p { margin: 6px 0; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
button, select, input { font: inherit; color: var(--text); }
button { background: #26303b; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #06130d; font-weight: 600; }
button.big { padding: 14px 20px; font-size: 18px; }
button.on { outline: 3px solid var(--accent); }
button:disabled { opacity: .45; }
select, input { background: #1b222b; border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
label { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
svg.lay { width: 100%; max-width: 420px; display: block; margin: 8px 0; }
.balls { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
.balls button { width: 100%; min-width: 0; padding: 0; border-radius: 50%; aspect-ratio: 1; font-weight: 700; font-size: 15px; }
#big { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 800; color: #fff; text-shadow: 0 0 20px #000; pointer-events: none; z-index: 4; }
#rec { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 40px); left: 12px; background: rgba(0,0,0,.6); border-radius: 8px; padding: 6px 10px; font-weight: 700; }
#rec b { color: var(--bad); }
#shotDone { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 18px); padding: 18px 34px; font-size: 20px; border-radius: 14px; }
#stopRack { position: fixed; z-index: 5; right: calc(env(safe-area-inset-right) + 16px); bottom: calc(env(safe-area-inset-bottom) + 18px); padding: 16px 28px; font-size: 20px; border-radius: 14px; background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
#confirm { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; padding: 20px; }
#confirm > div { background: #161b22; border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-width: 420px; }
.hidden { display: none !important; }
.warn { color: var(--warn); }
</style>
</head>
<body>
<video id="view" playsinline muted autoplay></video>
<div id="top"><span id="ver"></span><span class="grow" id="where"></span><span id="sizeTxt" class="muted"></span><span id="meter"><i></i></span></div>
<div id="rec" class="hidden"><b>●</b> REC <span id="recLeft"></span></div>
<button id="shotDone" class="primary hidden">Shot done</button>
<button id="stopRack" class="hidden">Stop</button>
<div id="confirm" class="hidden"><div><h2>Stop recording?</h2><p class="muted">Only stop once the last ball has stopped rolling.</p><div class="row"><button class="big" id="cfYes">Yes, stop</button><button class="primary big" id="cfNo">Keep recording</button></div></div></div>
<div id="big" class="hidden"></div>
<div id="panel"></div>
<script>
'use strict';
// Chalkline test recorder. It only records: it walks the player through the test sections in ladder order, records a
// short clip per step (video, sound, motion sensor, camera settings) and the player's tap answers, and saves them as
// zip files that each stay under the 30 MB upload limit. It does no tracking. Section contents and the reasons behind
// them: chalkline-data/plans/test-recorder-sections.md in the project files.
// R0.8 adds the cue-ball test session (38 short steps with pictures and a measurement form after each).
// R0.7 adds the continuous rack session: one recording for a whole rack, nothing asked between shots (see 'continuous
// rack mode' below).
const VERSION = 'R0.8';
const MB = 1048576, PART_LIMIT = 25 * MB, CLIP_MAX = 29 * MB;
const $ = s => document.querySelector(s);
const panel = $('#panel'), view = $('#view');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const r3 = v => Math.round(v * 1000) / 1000;
let SPEED = 1; // tests shorten every wait with this
const TAIL = 2.5;  // s still recorded after "Shot done", so the clip ends on a still table

// ---------- table geometry for the layout pictures ----------
// Table coordinates in diamonds: x 0..8 along the length, y 0..4 across, y = 0 the rail nearest a side camera.
const PK = { A: [0, 0], B: [4, 0], C: [8, 0], D: [0, 4], E: [4, 4], F: [8, 4] };
const INTO = { A: [1, 1], B: [0, 1], C: [-1, 1], D: [1, -1], E: [0, -1], F: [-1, -1] };
function along(pk, d) { const [px, py] = PK[pk], [dx, dy] = INTO[pk], k = Math.hypot(dx, dy); return [r3(px + dx / k * d), r3(py + dy / k * d)]; }
// a straight-in shot: the object ball ob diamonds out of the pocket, the striker cb diamonds out, on one line
function straight(pk, ob = 1.3, cb = 3, obBall = 1, striker = 0) { return { pocket: pk, balls: [{ b: obBall, at: along(pk, ob) }, { b: striker, at: along(pk, cb) }], aim: [striker, obBall] }; }
const SPREAD16 = [[1, 1], [2.2, 3], [3, 1.6], [4.6, 2.4], [5.6, 1], [6.8, 3], [7, 1.8], [1.6, 2.2], [2.8, 0.6], [3.6, 3.4], [5, 3.2], [6, 2.2], [7.4, 0.8], [0.8, 3.2], [4.2, 1.2], [5.4, 1.9]];
// The balls are set up once (spread16) and each later "at rest" layout only moves a few of them, so the player never
// has to set the whole table up again.
function moved(base, moves, extra = {}) { return { ...extra, balls: base.balls.map(o => moves[o.b] ? { b: o.b, at: moves[o.b] } : o) }; }
const SPREAD = { balls: SPREAD16.map((at, i) => ({ b: i, at })) };
const CLUSTER = moved(SPREAD, { 1: [3.6, 2.3], 2: [3.8, 2.3], 3: [3.7, 2.47], 4: [3.7, 2.13], 5: [4, 2.3] });
const FROZEN = moved(CLUSTER, { 6: [2.5, 0.1], 7: [6, 3.9], 8: [7.9, 2] });
const EVE = { balls: SPREAD16.slice(0, 10).map((at, i) => ({ b: i, at })) };
const LAYOUT = { spread10: EVE, spread16: SPREAD, cluster5: CLUSTER, frozen3: FROZEN, jaws: moved(FROZEN, { 9: [7.82, 3.82] }, { pocket: 'F' }) };

// ---------- the sections (see test-recorder-sections.md) ----------
// kind: camtest | clip | measure | play | note. ask: 'shot' asks which balls went in and whether any left the table.
// short: part of the short version for other camera spots. cd: countdown before recording, dur: seconds recorded.
const STILL = { cd: 6, dur: 10 }, HAND = { cd: 5, dur: 14 }, SHOT = { cd: 8, dur: 16, ask: 'shot' };
const LIGHTS = ['Normal lights', 'Table light off, room light on', 'One lamp off to one side', 'Warm lights mixed with daylight'];
const SECTIONS = [
  { id: 'camera', title: 'Camera check', intro: 'The recorder tests what it can control on this phone, and records short samples at each picture setting. Leave the phone on the tripod, pointed at the table, and don\'t touch it until it says it\'s done.', steps: [
    { id: 'camtest', kind: 'camtest', short: true, text: 'Testing the camera. Don\'t touch the phone.' }] },
  { id: 'table', title: 'Empty table', steps: [
    { id: 'empty', ...STILL, short: true, text: 'Take every ball off the table. Step away from the table.' },
    { id: 'sway', ...STILL, short: true, text: 'When it starts recording, tap the tripod lightly once, then step away.' },
    { id: 'bump', ...STILL, cd: 8, short: true, text: 'When it starts recording, nudge the tripod so the view shifts a little, and leave it there. Then step away.' },
    { id: 'measure', kind: 'measure', text: 'Optional, once per table: tape measurements, in inches. Leave any you don\'t have blank.' }] },
  { id: 'rest', title: 'Balls at rest', steps: [
    { id: 'spread', ...STILL, short: true, layout: 'spread16', text: 'Place all 16 balls roughly like the picture, none touching. You\'ll keep this layout for the whole section. Step away.' },
    ...LIGHTS.slice(1).map((l, i) => ({ id: 'light' + (i + 1), ...STILL, cd: 10, layout: 'spread16', light: l, text: 'Don\'t move any balls. Change the lighting to: ' + l + '. Step away.' })),
    { id: 'lightBack', kind: 'note', text: 'Put the lighting back to normal. Leave the balls where they are.' },
    { id: 'cluster', ...STILL, layout: 'cluster5', text: 'Move only the 1, 2, 3, 4 and 5 together into a cluster, all touching, like the picture. Leave the rest. Step away.' },
    { id: 'frozen', ...STILL, layout: 'frozen3', text: 'Move only the 6, 7 and 8 right against the rails (frozen), like the picture. Leave the rest. Step away.' },
    { id: 'jaws', ...STILL, layout: 'jaws', text: 'Move only the 9 into the marked pocket\'s jaws, sitting on the edge without dropping. Leave the rest. Step away.' }] },
  { id: 'hands', title: 'Hands and things', intro: 'These aren\'t shots. The recorder knows what you did, so there are no questions.', steps: [
    { id: 'pickpocket', ...HAND, text: 'Pick up a ball by hand and drop it in a pocket.' },
    { id: 'fromPocket', ...HAND, text: 'Take a ball out of a pocket and set it on the table.' },
    { id: 'rollHand', ...HAND, text: 'Roll a ball down the table by hand.' },
    { id: 'pushCue', ...HAND, text: 'Push a ball slowly with the cue tip, without striking it.' },
    { id: 'ballInHand', ...HAND, text: 'Place the white ball by hand, like ball in hand.' },
    { id: 'cueOnTable', ...HAND, text: 'Lay a cue across the table, then pick it up again.' },
    { id: 'chalk', ...HAND, dur: 18, text: 'Put chalk on the rail, then on the cloth, then take it away.' },
    { id: 'lean', ...HAND, text: 'Lean over the table for a few seconds without touching any ball.' },
    { id: 'practice', ...HAND, text: 'Take 5 practice strokes at the white ball without hitting it.' }] },
  { id: 'shots', title: 'Simple shots', intro: 'Set up each shot like the picture (close is fine). After each one, tap which balls went in.', steps: [
    ...['A', 'B', 'C', 'D', 'E', 'F'].map(pk => ({ id: 'straight' + pk, ...SHOT, short: true, layout: straight(pk), text: 'Straight in: shoot the 1 into the marked pocket.' })),
    { id: 'stop', ...SHOT, layout: straight('F', 1.5, 3.5), text: 'Stop shot: the white should stop where the 1 was.' },
    { id: 'follow', ...SHOT, layout: straight('C', 1.5, 3.5), text: 'Follow shot: the white follows after the 1.' },
    { id: 'draw', ...SHOT, short: true, layout: straight('D', 1.5, 3.5), text: 'Draw shot: the white comes back toward you.' },
    { id: 'cut2', ...SHOT, layout: { pocket: 'F', balls: [{ b: 1, at: [7.2, 3.5] }, { b: 0, at: [4, 1] }], aim: [0, 1] }, text: 'Cut the 1 into the marked pocket, and let the white go two rails.' },
    { id: 'bank', ...SHOT, layout: { pocket: 'E', balls: [{ b: 1, at: [4, 0.5] }, { b: 0, at: [2.5, 1.8] }], aim: [0, 1] }, text: 'Bank the 1 off the near rail into the marked side pocket.' },
    { id: 'kick', ...SHOT, layout: { pocket: 'F', balls: [{ b: 1, at: [6.8, 3.4] }, { b: 2, at: [4.4, 2.2] }, { b: 0, at: [2, 1] }], aim: [0, 1] }, text: 'Kick: the white hits a rail first, then the 1. The 2 is in the way.' },
    { id: 'lateRoll', ...SHOT, dur: 20, layout: straight('F', 2, 4), text: 'Hit it so softly that the 1 only just reaches the pocket.' },
    { id: 'rattle', ...SHOT, layout: straight('C', 2.5, 4.5), text: 'Hit it firmly and slightly off, so it may rattle in the jaws. Answer what really happened.' },
    { id: 'kiss', ...SHOT, layout: { balls: [{ b: 1, at: [5, 2] }, { b: 2, at: [5.6, 2.6] }, { b: 0, at: [3, 1] }], aim: [0, 1] }, text: 'Roll the white softly into the 1, so the 1 barely touches the 2.' },
    { id: 'scratch', ...SHOT, layout: straight('F', 1.2, 2.5), text: 'Scratch on purpose: follow the white into the pocket after the 1.' },
    { id: 'mightyX1', ...SHOT, layout: { pocket: 'A', balls: [{ b: 0, at: [2, 1] }, { b: 4, at: [6, 3] }], aim: [4, 0] }, text: 'Mighty X style: strike the 4 and shoot the white into the marked pocket.' },
    { id: 'mightyX2', ...SHOT, layout: { pocket: 'D', balls: [{ b: 0, at: [2, 3] }, { b: 4, at: [6, 1] }], aim: [4, 0] }, text: 'Mighty X style, the other way: strike the 4 and shoot the white into the marked pocket.' }] },
  { id: 'unusual', title: 'Unusual shots', intro: 'Skip anything you can\'t or don\'t want to do.', steps: [
    { id: 'jump', ...SHOT, layout: { balls: [{ b: 0, at: [2.5, 2] }, { b: 2, at: [3.2, 2] }, { b: 1, at: [5.5, 2] }], aim: [0, 1] }, text: 'Jump the white over the 2 and hit the 1.' },
    { id: 'miscue', ...SHOT, layout: straight('F'), text: 'A deliberate miscue, gently: let the tip slide off the white.' },
    { id: 'masse', ...SHOT, text: 'A massé or curve shot, any setup.' },
    { id: 'combo', ...SHOT, layout: { pocket: 'F', balls: [{ b: 1, at: [6.5, 3.3] }, { b: 2, at: [6.68, 3.38] }, { b: 0, at: [4, 1.5] }], aim: [0, 1] }, text: 'Combination with two frozen balls: the 1 and 2 touching, pointing at the marked pocket.' },
    { id: 'hardDraw', ...SHOT, layout: straight('E', 1.5, 3.5), text: 'A hard draw shot.' },
    { id: 'doubleHit', ...SHOT, layout: { balls: [{ b: 0, at: [5, 2] }, { b: 1, at: [5.22, 2] }], aim: [0, 1] }, text: 'Only if you can do it safely: the white a finger\'s width from the 1, and shoot through it (double hit or push).' }] },
  { id: 'people', title: 'People and bumps', steps: [
    { id: 'walkFront', ...HAND, text: 'Walk between the camera and the table, then step away.' },
    { id: 'standFront', ...HAND, text: 'Stand right in front of the phone for 5 seconds, then step away.' },
    { id: 'rollTap', ...HAND, cd: 6, text: 'Roll a ball by hand, then tap the tripod while it\'s still rolling.' },
    { id: 'awayShot', ...SHOT, text: 'Set up any easy shot into a pocket on the far side, so you shoot away from the phone. Stand on your shot line as normal. Your body may hide some of the table, and that\'s fine.' },
    { id: 'helperWalk', ...SHOT, opt: true, text: 'Only if someone else is there: they walk past behind the table while you shoot.' },
    { id: 'helperLean', ...SHOT, opt: true, text: 'Only if someone else is there: they lean on the rail while you shoot.' }] },
  { id: 'breaks', title: 'Breaks', intro: 'After each break, tap which balls went in.', steps: [
    { id: 'break9soft', ...SHOT, dur: 18, text: 'Rack 9-ball. Break softly.' },
    { id: 'break9med', ...SHOT, dur: 18, short: true, text: 'Rack 9-ball. Break at medium speed.' },
    { id: 'break9hard', ...SHOT, dur: 18, text: 'Rack 9-ball. Break hard.' },
    { id: 'break10', ...SHOT, dur: 18, text: 'Rack 10-ball. Break.' },
    { id: 'break15a', ...SHOT, dur: 20, text: 'Rack all 15 balls. Break.' },
    { id: 'break15b', ...SHOT, dur: 20, text: 'Rack all 15 balls again. Break.' }] },
  { id: 'play', title: 'Play', intro: 'Play one or two racks of 9-ball under pro rules, normally. Tap Record before each shot.', steps: [
    { id: 'play', kind: 'play', cd: 6, dur: 20, ask: 'shot', text: 'Tap Record, then take your shot. When every ball has stopped, tap Shot done and keep still for 2 more seconds.' }] },
];
// The evening check: a short session to repeat most evenings (about 10 to 15 minutes). The balls are set up once; each
// shot is played from wherever they lie, so nothing has to be set up exactly.
const EVENING = [
  { id: 'evening', title: 'Evening check', intro: 'About 10 to 15 minutes. Set the balls up once, then play each step from wherever they lie. After each shot, tap which balls went in.', steps: [
    { id: 'eRest', ...STILL, layout: 'spread10', text: 'Place the white and the 1 to 9 roughly like the picture, none touching. Step away.' },
    { id: 'eHide', ...HAND, text: 'Hold your hand flat over the 5 for about 3 seconds without touching it, then take it away and step back.' },
    { id: 'ePocket', ...SHOT, text: 'An easy shot: pocket the 1 in any pocket.' },
    { id: 'eMiss', ...SHOT, text: 'Shoot the 2 at a pocket and miss on purpose: hit it, but make sure it stays out.' },
    { id: 'eNear', ...SHOT, text: 'Hit the 3 softly toward a pocket so it stops just short of the pocket without going in.' },
    { id: 'eMulti', ...SHOT, text: 'Hit the white firmly into a group, so at least three balls move.' },
    { id: 'play', kind: 'play', cd: 6, dur: 20, ask: 'shot', text: 'One shot per recording. Shoot the lowest ball from wherever the balls lie, then answer. When every ball has stopped, tap Shot done and keep still for 2 more seconds. Do this 3 times without resetting the balls (re-rack only if the table is empty), then tap Finish playing.' }] },
];

// ---------- state (kept in this phone's storage, so a reload loses nothing) ----------
const S = { setup: null, sec: 0, step: 0, playN: 0, part: 1, clipN: 0, partBytes: 0, rate: 0, caps: null, cam: null, stream: null, rec: null, motion: [], motionOn: false, pending: [], busy: false, sessId: null };
function save() { try { localStorage.setItem('chalkRec', JSON.stringify({ setup: S.setup, sec: S.sec, step: S.step, playN: S.playN, part: S.part, clipN: S.clipN, partBytes: S.partBytes, rate: S.rate, caps: S.caps, sessId: S.sessId, pending: S.pending })); } catch (e) { } }
function load() { try { const v = JSON.parse(localStorage.getItem('chalkRec') || 'null'); if (v) Object.assign(S, v); } catch (e) { } }

// ---------- clip storage (IndexedDB, memory if that fails) ----------
const MEM = new Map(); let DB = null;
function db() { return DB || (DB = new Promise((res, rej) => { try { const q = indexedDB.open('chalkRec', 1); q.onupgradeneeded = () => q.result.createObjectStore('clips'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } })); }
async function idb(mode, fn) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('clips', mode), st = t.objectStore('clips'), q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); }
async function putClip(key, val) { try { await idb('readwrite', st => st.put(val, key)); } catch (e) { MEM.set(key, val); } }
async function getClip(key) { if (MEM.has(key)) return MEM.get(key); try { return await idb('readonly', st => st.get(key)); } catch (e) { return null; } }
async function delClip(key) { MEM.delete(key); try { await idb('readwrite', st => st.delete(key)); } catch (e) { } }
async function allKeys() { const k = [...MEM.keys()]; try { k.push(...await idb('readonly', st => st.getAllKeys())); } catch (e) { } return [...new Set(k.map(String))]; }

// ---------- zip (stored, not compressed: video is already compressed) ----------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF, dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name); off += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + (b.byteLength || b.length), 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(central, [e.buffer]), { type: 'application/zip' });
}

// ---------- camera, sound and motion ----------
const MODES = [ // picture settings sampled in the camera check; DEFAULT is used for everything else
  { id: '720p30', w: 1280, h: 720, fps: 30, bps: 2000000 },
  { id: '720p60', w: 1280, h: 720, fps: 60, bps: 2500000 },
  { id: '1080p30', w: 1920, h: 1080, fps: 30, bps: 4000000 },
  { id: '1080p60', w: 1920, h: 1080, fps: 60, bps: 6000000 },
];
const DEFAULT = { id: 'default', w: 1280, h: 720, fps: 60, bps: 2000000 };
const AUDIO = { echoCancellation: false, noiseSuppression: false, autoGainControl: false }; // keep the clicks as they are
let deviceId = null;
async function pickMainLens() {
  // the plain "Back Camera" is the 1x lens; the virtual dual/triple cameras switch lenses on their own
  try {

// ---------- continuous rack mode ----------
// One recording for a whole rack: start once before the break, stop after the last shot. Nothing is asked between shots
// and nothing is trimmed. The video is written to this phone's storage every second while it records, so a long rack
// never has to fit in memory. It is saved afterwards as numbered files that each stay under the upload limit: the video
// cut into byte ranges, which joined back in order are the original file. If recording is cut off (a call, the screen
// locking), what was recorded is kept, and recording can go on as a new segment of the same rack.
let RACK_PART = PART_LIMIT;  // tests lower this to get several files from a short recording
const RACK_LOW_SPACE = 300 * MB;  // stops on its own below this much free space, keeping what was recorded
const GAMES = ['9-ball', '10-ball', '8-ball', 'Other'];
const RK = { rec: null, racks: [] };
const RMEM = new Map(); let RDB = null;
function rdb() { return RDB || (RDB = new Promise((res, rej) => { try { const q = indexedDB.open('chalkRack', 1); q.onupgradeneeded = () => { q.result.createObjectStore('chunks'); q.result.createObjectStore('racks'); }; q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } })); }
async function rx(store, mode, fn) { const d = await rdb(); return new Promise((res, rej) => { const t = d.transaction(store, mode), st = t.objectStore(store), q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
async function rput(store, key, val) { try { await rx(store, 'readwrite', st => st.put(val, key)); } catch (e) { RMEM.set(store + ':' + key, val); RK.memOnly = true; } }
async function rget(store, key) { const m = RMEM.get(store + ':' + key); if (m !== undefined) return m; try { return await rx(store, 'readonly', st => st.get(key)); } catch (e) { return null; } }
async function rdel(store, range) { for (const k of [...RMEM.keys()]) if (k.startsWith(store + ':') && (typeof range === 'string' ? k.slice(store.length + 1) === range : range.includes(k.slice(store.length + 1)))) RMEM.delete(k); try { await rx(store, 'readwrite', st => st.delete(range)); } catch (e) { } }
const chunkKey = (id, seg, i) => id + '/' + seg + '/' + String(i).padStart(6, '0');
const segRange = (id, seg) => IDBKeyRange.bound(id + '/' + seg + '/', id + '/' + seg + '/￿');
async function segKeys(id, seg) {
  const pre = id + '/' + seg + '/', k = [...RMEM.keys()].filter(x => x.startsWith('chunks:' + pre)).map(x => x.slice(7));
  try { k.push(...await rx('chunks', 'readonly', st => st.getAllKeys(segRange(id, seg)))); } catch (e) { }
  return [...new Set(k.map(String))].sort();
}
const saveRack = rack => rput('racks', rack.id, rack);
async function loadRacks() {
  let list = [...RMEM.entries()].filter(([k]) => k.startsWith('racks:')).map(([, v]) => v);
  try { list = list.concat(await rx('racks', 'readonly', st => st.getAll())); } catch (e) { }
  const by = new Map(); for (const r of list) by.set(r.id, r);
  RK.racks = [...by.values()].sort((a, b) => a.epoch - b.epoch);
  // a rack that was still recording when the page was closed: keep every chunk that reached storage
  for (const r of RK.racks) if (r.state === 'recording' && !(RK.rec && RK.rec.rack.id === r.id)) {
    for (const g of r.segs) {

      if (keys.length > g.chunks.length) for (const k of keys.slice(g.chunks.length)) { const v = await rget('chunks', k); if (v && v.size) { g.chunks.push([+k.split('/').pop(), null, null, v.size]); g.bytes += v.size; } }

function rackSecs(r) { return r.segs.reduce((a, g) => a + (g.secs || 0), 0); }
function rackBytes(r) { return r.segs.reduce((a, g) => a + g.bytes, 0); }
function median(a) { if (!a.length) return null; const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; }
function rackFps(r) { return median(r.segs.flatMap(g => g.frames.slice(1, -1).map(f => f[1]))); }

  try { r = new MediaRecorder(S.stream, { mimeType: mime, videoBitsPerSecond: DEFAULT.bps, audioBitsPerSecond: 64000 }); }
  catch (e) { panel.innerHTML = '<h2>Recording didn\'t start</h2><p class="muted">' + esc(String(e && (e.name || e.message) || e)) + '</p><div class="row"><button class="primary" id="again">Back</button></div>'; $('#again').onclick = showRack; return; }
  const seg = { seg: rack.segs.length + 1, mime: mime || r.mimeType || '', epoch: Date.now(), started: new Date().toISOString(), secs: 0, bytes: 0, chunks: [], frames: [], events: [], motionPieces: 0, motionOn: S.motionOn, mode: DEFAULT.id, camera: trackInfo(), mic: [micState()], end: null };
  rack.segs.push(seg); rack.state = 'recording';
  const o = { r, rack, seg, t0: performance.now(), i: 0, q: Promise.resolve(), motion: [], storeFailed: false };
  RK.rec = o;
  r.ondataavailable = e => {
    if (!e.data || !e.data.size) return; const i = o.i++, blob = e.data;
    seg.chunks.push([i, Math.round(performance.now() - o.t0), Date.now(), blob.size]); seg.bytes += blob.size;
    o.q = o.q.then(async () => { await rput('chunks', chunkKey(rack.id, seg.seg, i), blob); if (i % 5 === 4) { await flushMotion(o); await saveRack(rack); } })
      .catch(err => { rackEv(o, 'store-failed', String(err)); o.storeFailed = true; });
  };
  r.onerror = e => { rackEv(o, 'recorder-error', String(e && e.error && (e.error.name || e.error.message) || e)); };
  o.stopped = new Promise(res => { r.onstop = res; });
  for (const t of S.stream.getTracks()) {
    t.onended = () => { rackEv(o, t.kind + '-ended'); if (t.kind === 'video' && document.visibilityState === 'visible') stopRack('camera was taken away'); };
    t.onmute = () => rackEv(o, t.kind + '-muted'); t.onunmute = () => rackEv(o, t.kind + '-unmuted');
  }
  // camera frames shown on screen, counted each second: the real frame rate while recording
  o.fc = { sec: 0, base: null };
  const onFrame = (now, md) => {
    if (RK.rec !== o) return;
    const s = Math.floor((performance.now() - o.t0) / 1000);
    if (o.fc.base === null) o.fc = { sec: s, base: md.presentedFrames };
    else if (s > o.fc.sec) { seg.frames.push([o.fc.sec, md.presentedFrames - o.fc.base, md.width, md.height]); o.fc = { sec: s, base: md.presentedFrames }; }
    view.requestVideoFrameCallback(onFrame);
  };
  if (view.requestVideoFrameCallback) view.requestVideoFrameCallback(onFrame);
  r.start(1000); keepAwake(); await saveRack(rack); beep(990, 220);
  // on screen while recording: time, size, frame rate and the Stop button only
  panel.classList.add('hidden'); $('#rec').classList.remove('hidden'); $('#stopRack').classList.remove('hidden');
  o.tick = setInterval(() => {
    const s = (performance.now() - o.t0) / 1000, f = seg.frames.length ? seg.frames[seg.frames.length - 1][1] : null;
    $('#recLeft').textContent = mmss(s) + ' · ' + (seg.bytes / MB).toFixed(0) + ' MB' + (f ? ' · ' + f + ' fps' : '') + (rack.segs.length > 1 ? ' · part ' + seg.seg : '');
    if (o.storeFailed) stopRack('could not save to the phone\'s storage');
    else if (document.visibilityState === 'visible' && S.stream.getVideoTracks().some(t => t.readyState === 'ended')) stopRack('the camera was taken away');
  }, 500);
  o.space = setInterval(async () => {
    try { const e = await navigator.storage.estimate(); rackEv(o, 'storage', [Math.round(e.usage / MB), Math.round(e.quota / MB)]); if (e.quota - e.usage < RACK_LOW_SPACE) stopRack('the phone is almost out of space'); } catch (e) { }
  }, 30000);
  $('#stopRack').onclick = () => $('#confirm').classList.remove('hidden');
  $('#cfNo').onclick = () => $('#confirm').classList.add('hidden');
  $('#cfYes').onclick = () => { $('#confirm').classList.add('hidden'); stopRack('stopped'); };
}
async function stopRack(reason) {
  const o = RK.rec; if (!o || o.stopping) return; o.stopping = true;
  clearInterval(o.tick); clearInterval(o.space);
  $('#stopRack').classList.add('hidden'); $('#confirm').classList.add('hidden'); $('#rec').classList.add('hidden');
  panel.classList.remove('hidden'); panel.innerHTML = '<h2>Saving the recording…</h2>';
  if (o.r.state !== 'inactive') { try { o.r.stop(); } catch (e) { } }
  await Promise.race([o.stopped, sleep(5000)]);
  await sleep(50); await o.q;
  o.seg.secs = r3((performance.now() - o.t0) / 1000); o.seg.end = reason; o.seg.mic.push(micState()); rackEv(o, 'stop', reason);
  await flushMotion(o);
  o.rack.state = 'done'; await saveRack(o.rack); RK.rec = null; beep(520, 250);
  if (reason !== 'stopped') return showCutOff(o.rack, reason);
  showRackDone(o.rack);
}
// the page was hidden while recording (screen locked, a call, another app): Safari usually stops the camera
function rackVisibility() {
  const o = RK.rec; if (!o) return;
  if (document.visibilityState !== 'visible') { rackEv(o, 'hidden'); return; }
  rackEv(o, 'visible'); keepAwake();
  const ok = o.r.state === 'recording' && S.stream && S.stream.getVideoTracks().every(t => t.readyState === 'live');
  if (!ok) stopRack('the phone left the recorder');
  else $('#where').textContent = 'Interrupted at ' + mmss(o.seg.events.filter(e => e[2] === 'hidden').pop()[0] / 1000) + ', still recording';
}
function showCutOff(rack, reason) {
  setWhere('Rack ' + rack.n);
  panel.innerHTML = '<h2>Recording stopped: ' + esc(reason) + '</h2><p>Everything up to then is kept (' + mmss(rackSecs(rack)) + ').</p><p class="muted">If the rack isn\'t finished, leave the balls where they are and carry on recording. It\'s saved as part ' + (rack.segs.length + 1) + ' of the same rack.</p>' +
    '<div class="row"><button class="primary big" id="goOn">Carry on recording</button><button id="fin">The rack is finished</button></div>';
  $('#goOn').onclick = async () => { panel.innerHTML = '<p>Starting the camera…</p>'; try { await openCamera(S.mode || DEFAULT); } catch (e) { } startRack(rack); };
  $('#fin').onclick = () => showRackDone(rack);
}

// ---------- saving a rack: numbered files under the upload limit ----------
function rackName(r) { return 'chalkline-' + VERSION + '-' + (r.session || 'rack') + '-rack' + r.n; }
// each file carries one byte range of one segment's video; a segment's motion log goes with its last range when it fits
async function rackPlan(r) {
  const plan = [], budget = RACK_PART - Math.min(512 * 1024, RACK_PART / 4);  // room for meta.json
  for (const g of r.segs) {
    const motionKeys = (await segKeys(r.id, g.seg)).filter(k => /\/m\d{4}$/.test(k));
    let mb = 0; for (const k of motionKeys) { const v = await rget('chunks', k); mb += (v ? v.length : 0) * 60; }
    const base = r.segs.length > 1 ? 'rack' + r.n + '-seg' + g.seg : 'rack' + r.n, ext = extOf(g.mime);
    const n = Math.max(1, Math.ceil(g.bytes / budget)), pieces = [];
    for (let i = 0; i < n; i++) pieces.push({ seg: g.seg, name: base + ext + '.' + String(i + 1).padStart(3, '0'), video: base + ext, from: Math.round(g.bytes * i / n), to: Math.round(g.bytes * (i + 1) / n) });
    const lastP = pieces[pieces.length - 1];
    const motion = { seg: g.seg, name: base + '-motion.json', keys: motionKeys };
    if ((lastP.to - lastP.from) + mb < budget) plan.push(...pieces.slice(0, -1).map(p => ({ files: [p] })), { files: [lastP, motion] });
    else plan.push(...pieces.map(p => ({ files: [p] })), { files: [motion] });
  }
  return plan.map((p, i) => ({ part: i + 1, ...p }));
}
async function segBlob(r, g) {
  const keys = (await segKeys(r.id, g.seg)).filter(k => /\/\d{6}$/.test(k)), blobs = [];
  for (const k of keys) { const v = await rget('chunks', k); if (v) blobs.push(v); }
  return new Blob(blobs, { type: (g.mime || 'video/mp4').split(';')[0] });
}
function rackMeta(r, plan, part) {
  return { app: 'chalkline-recorder', version: VERSION, kind: 'continuous-rack', rack: r.n, id: r.id, game: r.game, session: r.session, started: r.started, epoch: r.epoch, timeOrigin: r.timeOrigin, ua: r.ua, setup: r.setup, part, parts: plan.length,
    join: 'Join each video\'s pieces in order (.001, .002, ...) to get the original file, e.g. cat rack1.mp4.0* > rack1.mp4',
    files: plan.map(p => ({ part: p.part, files: p.files.map(f => f.video ? { name: f.name, video: f.video, seg: f.seg, from: f.from, to: f.to } : { name: f.name, seg: f.seg }) })),
    segments: r.segs.map(g => ({ seg: g.seg, started: g.started, epoch: g.epoch, secs: g.secs, bytes: g.bytes, mime: g.mime, mode: g.mode, camera: g.camera, mic: g.mic, end: g.end, motionOn: g.motionOn,
      chunkCols: ['i', 'msSinceStart', 'epochMs', 'bytes'], chunks: g.chunks, frameCols: ['second', 'framesShown', 'width', 'height'], frames: g.frames, eventCols: ['msSinceStart', 'epochMs', 'event', 'detail'], events: g.events })) };
}
async function packRackPart(r, plan, k) {
  const p = plan[k - 1], enc = new TextEncoder(), files = [];
  const blobs = {};
  for (const f of p.files) {
    if (f.video) { blobs[f.seg] = blobs[f.seg] || await segBlob(r, r.segs.find(g => g.seg === f.seg)); files.push({ name: f.name, data: new Uint8Array(await blobs[f.seg].slice(f.from, f.to).arrayBuffer()) }); }
    else { let rows = []; for (const key of f.keys) { const v = await rget('chunks', key); if (v) rows = rows.concat(v); } files.push({ name: f.name, data: enc.encode(JSON.stringify({ cols: ['ms', 'ax', 'ay', 'az', 'rotA', 'rotB', 'rotG'], rows })) }); }
  }
  files.unshift({ name: 'meta.json', data: enc.encode(JSON.stringify(rackMeta(r, plan, k), null, 1)) });
  const blob = makeZip(files), name = rackName(r) + '-part' + String(k).padStart(2, '0') + '-of-' + String(plan.length).padStart(2, '0') + '.zip';
  let file = null; try { file = new File([blob], name, { type: 'application/zip' }); } catch (e) { }
  return { blob, file, name, mb: blob.size / MB };
}
async function shareOrDownload(files, blob, name) {
  if (files.every(Boolean) && navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return 'shared'; } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000); } catch (e) { }
  return 'downloaded';
}
async function showRackDone(r) {
  setWhere('Rack ' + r.n); panel.classList.remove('hidden');
  const plan = await rackPlan(r), fps = rackFps(r), cuts = r.segs.filter(g => g.end && g.end !== 'stopped').length, hid = r.segs.reduce((a, g) => a + g.events.filter(e => e[2] === 'hidden').length, 0);
  const left = plan.filter(p => !r.savedParts.includes(p.part)).map(p => p.part);
  let h = '<h2>Rack ' + r.n + ': ' + mmss(rackSecs(r)) + ', ' + (rackBytes(r) / MB).toFixed(rackBytes(r) < 10 * MB ? 1 : 0) + ' MB</h2>' +
    '<p class="muted">' + (fps ? 'Frame rate ' + fps + ' fps. ' : '') + (r.segs.length > 1 ? r.segs.length + ' recordings (cut off ' + cuts + ' times). ' : '') + (hid ? 'The recorder was hidden ' + hid + ' times. ' : '') + '</p>' +
    '<p>For the project chat it\'s saved as <b>' + plan.length + ' file' + (plan.length > 1 ? 's' : '') + '</b> of up to 25 MB. Save each one to Files, then send them all to Claude.</p>' +
    '<div class="row"><button class="primary big" id="nextPart">' + (left.length ? 'Save file ' + left[0] + ' of ' + plan.length : 'All files saved') + '</button></div>' +
    '<p class="muted">Saved: ' + (r.savedParts.length ? r.savedParts.slice().sort((a, b) => a - b).join(', ') : 'none yet') + '</p>' +
    '<div class="row"><button id="whole">Save as one video</button><button id="toRacks">Back to racks</button><button id="delRack">Delete from this phone</button></div>';
  panel.innerHTML = h;
  const nb = $('#nextPart'); if (!left.length) nb.disabled = true;
  // packing and sharing are two taps: the phone only allows sharing straight from a tap
  nb.onclick = async () => {
    const k = left[0]; nb.disabled = true; nb.textContent = 'Packing file ' + k + '…';
    const z = await packRackPart(r, plan, k); nb.disabled = false; nb.textContent = 'Save file ' + k + ' (' + z.mb.toFixed(1) + ' MB)';
    nb.onclick = async () => {
      const how = await shareOrDownload([z.file], z.blob, z.name);
      if (how === 'cancelled') return;
      if (!r.savedParts.includes(k)) r.savedParts.push(k);
      r.saved = r.savedParts.length >= plan.length; await saveRack(r); showRackDone(r);
    };
  };
  $('#whole').onclick = async () => {
    const files = [], enc = new TextEncoder();
    for (const g of r.segs) { const b = await segBlob(r, g); try { files.push(new File([b], (r.segs.length > 1 ? 'rack' + r.n + '-seg' + g.seg : 'rack' + r.n) + extOf(g.mime), { type: b.type })); } catch (e) { } }
    try { files.push(new File([enc.encode(JSON.stringify(rackMeta(r, plan, 0), null, 1))], rackName(r) + '-meta.json', { type: 'application/json' })); } catch (e) { }
    const how = await shareOrDownload(files, files[0], files[0] && files[0].name);
    if (how === 'downloaded' && files.length > 1) for (const f of files.slice(1)) await shareOrDownload([f], f, f.name);
  };
  $('#toRacks').onclick = showRack;
  $('#delRack').onclick = async () => {
    if (!r.saved && !confirm('This rack hasn\'t been saved to files yet. Delete it anyway?')) return;
    for (const g of r.segs) await rdel('chunks', segRange(r.id, g.seg));
    await rdel('racks', r.id); RK.racks = RK.racks.filter(x => x !== r); showRack();
  };
}

$('#ver').textContent = VERSION;
load(); meterUpd();
if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) panel.innerHTML = '<h2>This browser can\'t record</h2><p>Open this page in Safari on the iPhone, from its https address.</p>';
else if (S.setup && S.sessId) showResume(); else showSetup();
window.__rec = { S, SECTIONS, EVENING, CUEBALL, save, LAYOUT, steps, packPart, partSaved, setSpeed: v => { SPEED = v; }, layoutSvg, makeZip, RK, loadRacks, rackPlan, stopRack, setRackPart: v => { RACK_PART = v; } };
</script>
